name: autodev

services:
  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////data/autodev.db
      WORKSPACE_DIR: /workspaces
      DEMO_REPO_DIR: /app/demo_repo
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      AUTODEV_API_TOKEN: ${AUTODEV_API_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_DEFAULT_BASE_BRANCH: ${GITHUB_DEFAULT_BASE_BRANCH:-}
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      SANDBOX_MODE: docker
      SANDBOX_URL: http://worker:8010
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-change-me-sandbox-token}
      REQUIRE_PLAN_APPROVAL: ${REQUIRE_PLAN_APPROVAL:-true}
      REQUIRE_PR_APPROVAL: ${REQUIRE_PR_APPROVAL:-true}
      AGENT_MAX_CONCURRENT_TASKS: ${AGENT_MAX_CONCURRENT_TASKS:-2}
    volumes:
      - autodev-data:/data
      - autodev-workspaces:/workspaces
    networks:
      - frontend
      - sandbox
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  worker:
    build:
      context: ./worker
    environment:
      WORKSPACES_ROOT: /workspaces
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-change-me-sandbox-token}
      ALLOWED_COMMANDS: ${ALLOWED_COMMANDS:-python,python3,pytest,npm,node,yarn,pnpm,ruff,tsc,go,cargo}
    volumes:
      - autodev-workspaces:/workspaces
    networks:
      - sandbox
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "8080:80"
    networks:
      - frontend
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  frontend:
  sandbox:
    internal: true

volumes:
  autodev-data:
  autodev-workspaces:
