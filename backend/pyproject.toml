[project]
name = "autodev-backend"
version = "0.1.0"
description = "AutoDev autonomous AI coding agent backend"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 110
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = [
  "S101",  # asserts in tests
  "S603",  # subprocess is the point of the agent, guarded by an allowlist
  "S607",  # partial executable paths resolved internally
  "B008",  # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108"]
"app/integrations/github/service.py" = ["S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
